name: CI

on:
  push:
    branches: ['0.7.x']
  pull_request:
    branches: ['0.7.x']

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      # Install from composer.lock, as create-project does
      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: cp .env.example .env

      - run: composer test
